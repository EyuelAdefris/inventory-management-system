<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="16" y1="7" x2="16" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="8" y1="13" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="24" y1="13" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4f46e5" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#818cf8" stroke-opacity="0.3"/>

  <!-- 3D Isometric Inventory Box -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M16 7.5L24 11.5L16 15.5L8 11.5L16 7.5Z" fill="url(#boxTop)"/>
    
    <!-- Left Face -->
    <path d="M8 11.5L16 15.5V24.5L8 20.5V11.5Z" fill="url(#boxLeft)"/>
    
    <!-- Right Face -->
    <path d="M16 15.5L24 11.5V20.5L16 24.5V15.5Z" fill="url(#boxRight)"/>
    
    <!-- Inner Seam Lines -->
    <path d="M16 15.5V24.5" stroke="#1e1b4b" stroke-width="0.75" stroke-opacity="0.5"/>
    <path d="M16 7.5L16 11.5" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.6"/>
    <path d="M12 9.5L20 13.5" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.6"/>
  </g>
</svg>
